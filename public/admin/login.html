<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion Administrateur — SportMap Bénin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Styles personnalisés -->
    <link rel="stylesheet" href="/css/style.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* ============================================
           VIDÉO EN ARRIÈRE-PLAN
           ============================================ */

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8; /* Vidéo plus visible */
        }

        /* Overlay sombre très léger pour lisibilité */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: rgba(15, 10, 31, 0.2); /* Overlay réduit */
            pointer-events: none;
        }

        /* ============================================
           CARTE DE CONNEXION (glassmorphism allégé)
           ============================================ */

        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(15, 10, 31, 0.45); /* Opacité réduite */
            backdrop-filter: blur(16px); /* Flou légèrement réduit */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 32px;
            padding: 60px 50px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            transition: border-color 0.4s ease;
        }

        .glass-card:hover {
            border-color: rgba(250, 204, 21, 0.3);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container img {
            height: 72px;
            width: auto;
            margin: 0 auto 16px;
        }

        .logo-container h1 {
            font-size: 32px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }

        .logo-container p {
            color: #C4B5FD;
            font-size: 15px;
            margin-top: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .field-group {
            margin-bottom: 28px;
        }

        .field-group label {
            display: block;
            font-weight: 600;
            font-size: 16px;
            color: #E5E7EB;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .field-group label i {
            color: #FACC15;
            margin-right: 10px;
            width: 20px;
        }

        .field-group input {
            background: rgba(15, 10, 31, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: #FFFFFF;
            border-radius: 16px;
            padding: 18px 24px;
            width: 100%;
            font-size: 18px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }

        .field-group input::placeholder {
            color: #A5B4FC;
            font-size: 16px;
        }

        .field-group input:focus {
            outline: none;
            border-color: #A855F7;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FACC15, #FBBF24);
            color: #0F0A1F;
            font-weight: 700;
            font-size: 18px;
            padding: 18px 32px;
            border-radius: 60px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-primary:hover {
            box-shadow: 0 0 40px rgba(250, 204, 21, 0.3);
            transform: scale(1.01);
        }

        .error-message {
            display: none;
            margin-top: 20px;
            padding: 14px 18px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #F87171;
            border-radius: 12px;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        .error-message i {
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 40px 24px;
            }
            .logo-container h1 {
                font-size: 26px;
            }
            .field-group input {
                padding: 16px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================
    VIDÉO EN ARRIÈRE-PLAN
    ============================================ -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="/videos/Video Project 2.mp4" type="video/mp4" />
            Ton navigateur ne supporte pas la vidéo.
        </video>
    </div>

    <!-- Overlay très léger -->
    <div class="video-overlay"></div>

    <!-- ============================================
    CARTE DE CONNEXION (plus transparente)
    ============================================ -->
    <div class="glass-card">

        <!-- Logo -->
        <div class="logo-container">
            <img src="/images/logo.png" alt="SportMap Bénin" />
            <h1>SportMap Bénin</h1>
            <p>Connexion administrateur</p>
        </div>

        <!-- Formulaire -->
        <form id="loginForm">
            <div class="field-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" id="email" placeholder="admin@sportmap.bj" required />
            </div>

            <div class="field-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Mot de passe
                </label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <button type="submit" class="btn-primary">
                <i class="fas fa-arrow-right-to-bracket"></i> Se connecter
            </button>

            <div id="loginError" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage">Identifiants incorrects.</span>
            </div>
        </form>

    </div>

    <script type="module">
        import { loginAdmin } from '/js/api.js';

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('loginError');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const motDePasse = passwordInput.value.trim();

            if (!email || !motDePasse) {
                errorMessage.textContent = 'Veuillez remplir tous les champs.';
                errorDiv.classList.add('show');
                return;
            }

            try {
                const response = await loginAdmin(email, motDePasse);

                localStorage.setItem('adminToken', response.token);
                localStorage.setItem('adminUser', JSON.stringify(response.admin));

                window.location.href = '/admin/dashboard.html';

            } catch (error) {
                console.error(error);
                errorMessage.textContent = error.message || 'Identifiants incorrects. Veuillez réessayer.';
                errorDiv.classList.add('show');
                setTimeout(() => {
                    errorDiv.classList.remove('show');
                }, 5000);
            }
        });
    </script>

</body>
</html>
